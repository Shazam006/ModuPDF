name: modupdf
services:
  api:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      MAX_PAGES: ${MAX_PAGES:-500}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-1}
      TOOL_TIMEOUT_SECONDS: ${TOOL_TIMEOUT_SECONDS:-300}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://shazam006.github.io,http://localhost:8080,http://127.0.0.1:8080}
      WORK_DIR: /tmp/modupdf
    expose: ["8000"]
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    mem_limit: 1500m
    cpus: 1.5
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./deploy/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    mem_limit: 128m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
